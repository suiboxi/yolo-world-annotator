[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-world-annotator"
version = "0.1.0"
description = "Local desktop auto-annotation with YOLO-World and automatic CUDA/CPU selection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "YOLO-World Annotator contributors" }]
keywords = ["annotation", "computer-vision", "dataset", "yolo-world"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "Pillow>=10,<13",
  "PySide6>=6.8,<7",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
  "ultralytics>=8.4.127,<9",
]

[project.optional-dependencies]
verification = [
  "accelerate>=1,<2",
  "sentencepiece>=0.2,<1",
  "transformers>=4.48,<6",
]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "build>=1.2,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]
build = [
  "pyinstaller>=6.15,<7",
]

[project.scripts]
yolo-world-annotator = "yolo_world_annotator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: requires a working CUDA runtime and GPU",
  "integration: exercises model files or external runtimes",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
